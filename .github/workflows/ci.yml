# Quality gate for every push and PR. This workflow NEVER publishes anything: releases are cut
# only by pushing a v* tag, which triggers .github/workflows/release.yml.
#
# src/ is strict TypeScript and there is no test suite, so the gate is lint + type-check + knip +
# build, plus a packaging smoke test per platform so a broken electron/capacitor config is caught
# here rather than in the middle of a release.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn type-check
      - name: Knip
        run: yarn knip
      - name: Build web app
        run: yarn build
        env:
          CI: ''
      - name: Verify build outputs
        run: |
          ls -la build/
          test -f build/index.html
      - name: Verify forge config
        run: node -e "import('./forge.config.js').then((c) => console.log('forge config loaded, makers:', c.default.makers?.length || 0)).catch((e) => { console.error(e); process.exit(1); })"
      - name: Verify the dev-only inspectors stayed out of the bundle
        run: |
          if grep -rl "__REACT_GRAB__\|__getReactScanReport" build/assets; then
            echo "::error::react-scan / react-grab leaked into the production bundle"
            exit 1
          fi

  package-linux:
    name: Package Linux
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v1-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v1-
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      - name: Package Electron app
        run: yarn electron:package
      - run: ls -la out/

  android-build:
    name: Android Build
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      - name: Build web app
        run: yarn build
        env:
          CI: ''
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace
