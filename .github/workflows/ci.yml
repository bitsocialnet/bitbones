# Quality gate for every push and PR. This workflow NEVER publishes anything: releases are cut
# only by pushing a v* tag, which triggers .github/workflows/release.yml.
#
# src/ is strict TypeScript. Quality checks cover lint, types, Knip, build, and React runtime
# scenarios, plus a packaging smoke test per platform so a broken electron/capacitor config is caught
# here rather than in the middle of a release.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: |
          if yarn_cache_dir=$(corepack yarn config get cacheFolder) && [ -n "$yarn_cache_dir" ]; then
            echo "dir=$yarn_cache_dir" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Yarn package tarballs
        if: steps.yarn-cache.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn type-check
      - name: Knip
        run: yarn knip
      - name: React Doctor diagnostics
        run: yarn doctor:check
        env:
          PERF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
      - name: Build web app
        run: yarn build
        env:
          CI: ''
      - name: Verify build outputs
        run: |
          ls -la build/
          test -f build/index.html
      - name: Test the release manifest generator
        run: yarn release:manifest:test
      - name: Test submit validation
        run: yarn submit:test
      - name: Test release notes
        run: node --test scripts/__tests__/release-body.node-test.mjs
      - name: Verify the release manifest covers the build
        run: |
          yarn release:manifest --build-dir build --out-dir "$RUNNER_TEMP/release-manifest"
          node -e "const m = require(process.argv[1]); if (!m.files.some((f) => f.path === 'index.html')) { console.error('::error::index.html is missing from the release manifest'); process.exit(1); }" "$RUNNER_TEMP/release-manifest/bitbones-release-manifest.json"
      - name: Verify forge config
        run: node -e "import('./forge.config.js').then((c) => console.log('forge config loaded, makers:', c.default.makers?.length || 0)).catch((e) => { console.error(e); process.exit(1); })"
      - name: Verify the dev-only inspectors stayed out of the bundle
        run: |
          if grep -rlE "__REACT_PERF__|agentation-dev-tools|data-feedback-toolbar|__PROFILING__|__ELEMENT_SOURCE__" build/assets; then
            echo "::error::React profiler / Agentation / element-source leaked into the production bundle"
            exit 1
          fi

      - name: Install performance browser
        run: yarn perf:install --with-deps
      - name: Check React runtime scenarios
        run: yarn perf:check --output .react-perf/ci
      - name: Upload React performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-performance
          path: .react-perf/ci/
          include-hidden-files: true
          if-no-files-found: warn

  package-linux:
    name: Package Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: |
          if yarn_cache_dir=$(corepack yarn config get cacheFolder) && [ -n "$yarn_cache_dir" ]; then
            echo "dir=$yarn_cache_dir" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Yarn package tarballs
        if: steps.yarn-cache.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v1-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v1-
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      # Electron 44's V8 headers put [[deprecated]] before __attribute__ in class heads, which GCC
      # only parses from 13 (bug 69585); ubuntu-22.04 tops out at GCC 12, so native modules build with clang
      # and keep the 22.04 glibc/libstdc++ baseline.
      - name: Package Electron app
        env:
          CC: clang-15
          CXX: clang++-15
        run: yarn electron:package
      - run: ls -la out/

  android-build:
    name: Android Build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: |
          if yarn_cache_dir=$(corepack yarn config get cacheFolder) && [ -n "$yarn_cache_dir" ]; then
            echo "dir=$yarn_cache_dir" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Yarn package tarballs
        if: steps.yarn-cache.outputs.dir != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done
      - name: Build web app
        run: yarn build
        env:
          CI: ''
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace
