<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="bare bones gui client for bitsocial" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>bitbones</title>

    <!--
      Dev-only render inspectors (react-scan, element-source, react-grab). The whole thing is behind
      `import.meta.env.DEV`, which Vite replaces with the literal `false` in a production build, so
      the dynamic import is dead code and none of those packages reach the shipped bundle. Keep the
      guard here rather than in src/ so it stays in one obvious place; the instrumentation itself
      lives in src/lib/react-scan.js, which the playwright-cli browser skills drive.
    -->
    <script type="module">
      if (import.meta.env.DEV) {
        import('./src/lib/react-scan.js');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
